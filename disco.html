<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panic: At The Disco</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #05000c;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    #visualizer-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      background: rgba(5, 0, 12, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease;
    }

    .start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .disco-title {
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: #ff007f;
      text-shadow: 0 0 15px #ff007f, 0 0 30px #00f0ff;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .disco-subtext {
      font-size: 1.05rem;
      color: #00f0ff;
      font-weight: 600;
      margin-bottom: 28px;
      max-width: 320px;
      line-height: 1.4;
    }

    .btn-start-mic {
      background: #ff007f;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 16px 36px;
      border-radius: 40px;
      border: 2px solid #ffffff;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.8), 0 0 40px rgba(0, 240, 255, 0.4);
      cursor: pointer;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-start-mic:active {
      transform: scale(0.94);
      background: #d6006b;
    }

    .top-hud-bar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 10;
      pointer-events: none;
    }

    .hud-chip {
      background: rgba(0, 0, 0, 0.75);
      border: 1.5px solid #00f0ff;
      color: #00f0ff;
      font-size: 0.9rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .bottom-hud-container {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 10;
      pointer-events: auto;
    }

    .btn-back-drive {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #4cd964;
      color: #4cd964;
      font-size: 1.15rem;
      font-weight: 900;
      padding: 14px 32px;
      border-radius: 30px;
      box-shadow: 0 0 15px rgba(76, 217, 100, 0.5), inset 0 0 10px rgba(76, 217, 100, 0.2);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-back-drive:active {
      transform: scale(0.92);
      background: rgba(76, 217, 100, 0.25);
    }
  </style>
</head>
<body>

  <canvas id="visualizer-canvas"></canvas>

  <div class="start-overlay" id="start-overlay">
    <div class="disco-title">PANIC MODE</div>
    <div class="disco-subtext">Tap below to activate real-time audio reactivity.</div>
    <button class="btn-start-mic" onclick="startAudioReactiveEngine()">ENGAGE DISCO</button>
  </div>

  <div class="top-hud-bar">
    <div class="hud-chip">DISCO ACTIVE</div>
    <div class="hud-chip" id="bpm-badge">SYNCING...</div>
  </div>

  <div class="bottom-hud-container">
    <button class="btn-back-drive" onclick="returnToDashboard()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4cd964" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      BACK TO DRIVING
    </button>
  </div>

  <script>
    let audioContext = null;
    let analyser = null;
    let sourceNode = null;
    let streamReference = null;
    let dataArray = null;
    let bufferLength = 0;
    let isRunning = false;

    const canvas = document.getElementById('visualizer-canvas');
    const ctx = canvas.getContext('2d');

    let rotationAngle = 0;
    let particles = [];

    // Star-Eyed Emoji State (Independent Random Spin & Momentum)
    let emojiAngle = 0;
    let emojiSpinSpeed = 0.025;
    let emojiTargetSpinSpeed = 0.025;
    let lastFlipTime = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      initParticles();
    }

    function initParticles() {
      particles = [];
      const numParticles = 40;
      for (let i = 0; i < numParticles; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: Math.random() * 2.5 + 1,
          speed: Math.random() * 1.5 + 0.5,
          color: i % 2 === 0 ? '#00f0ff' : '#ff007f'
        });
      }
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    async function startAudioReactiveEngine() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        streamReference = stream;

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.78;

        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        sourceNode = audioContext.createMediaStreamSource(stream);
        sourceNode.connect(analyser);

        document.getElementById('start-overlay').classList.add('hidden');
        isRunning = true;
        renderVisualizer();
      } catch (err) {
        console.warn("Microphone access fallback:", err);
        document.getElementById('start-overlay').classList.add('hidden');
        isRunning = true;
        renderSyntheticVisualizer();
      }
    }

    function renderVisualizer() {
      if (!isRunning) return;
      requestAnimationFrame(renderVisualizer);

      analyser.getByteFrequencyData(dataArray);

      const width = window.innerWidth;
      const height = window.innerHeight;
      const centerX = width / 2;
      const centerY = height / 2;

      // Bass Calculation (First 8 bins)
      let bassSum = 0;
      for (let i = 0; i < 8; i++) {
        bassSum += dataArray[i];
      }
      const bassAvg = bassSum / 8;
      const bassRatio = bassAvg / 255;

      // Dark fade trails
      ctx.fillStyle = `rgba(5, 0, 12, ${0.2 + (1 - bassRatio) * 0.12})`;
      ctx.fillRect(0, 0, width, height);

      // --- 1. VERTICAL FLOATING PARTICLES ---
      particles.forEach(p => {
        p.y -= p.speed * (1 + bassRatio * 3.5);
        if (p.y < 0) {
          p.y = height;
          p.x = Math.random() * width;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 + bassRatio * 0.8), 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fill();
      });

      // --- 2. DUAL VERTICAL EQ TOWERS (LEFT & RIGHT) ---
      const numBars = 24;
      const barHeight = (height * 0.6) / numBars;
      const barStartY = height * 0.2;
      const maxBarWidth = width * 0.18;

      for (let i = 0; i < numBars; i++) {
        const freqVal = dataArray[Math.floor((i / numBars) * (bufferLength * 0.65))] / 255;
        const currentBarWidth = Math.max(4, freqVal * maxBarWidth);
        const y = barStartY + i * barHeight;

        // Color Gradient: Cyan at bottom, Yellow in mid, Pink at top
        const barColor = i < 8 ? '#00f0ff' : i < 16 ? '#ffe600' : '#ff0055';

        // Left Tower
        ctx.fillStyle = barColor;
        ctx.shadowBlur = 10;
        ctx.shadowColor = barColor;
        ctx.fillRect(8, y + 2, currentBarWidth, barHeight - 4);

        // Right Tower (Mirrored)
        ctx.fillRect(width - 8 - currentBarWidth, y + 2, currentBarWidth, barHeight - 4);
      }

      // --- 3. CENTER TUNNEL & CLAMPED RADIAL BEAMS ---
      rotationAngle += 0.008 + bassRatio * 0.02;
      const pulseScale = 0.85 + bassRatio * 0.4;
      const radiusBase = Math.min(width, height) * 0.22 * pulseScale;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rotationAngle);

      // Clamped Radial Beams (never exceed screen bounds)
      const maxAllowedBeam = (Math.min(width, height) * 0.38);
      const numBeams = 16;
      for (let b = 0; b < numBeams; b++) {
        const beamAngle = (b / numBeams) * Math.PI * 2;
        const freqVal = dataArray[b * 3] / 255;
        const beamLength = Math.min(maxAllowedBeam, (radiusBase * 0.6) + (maxAllowedBeam * freqVal));

        const x1 = Math.cos(beamAngle) * radiusBase;
        const y1 = Math.sin(beamAngle) * radiusBase;
        const x2 = Math.cos(beamAngle) * (radiusBase + beamLength);
        const y2 = Math.sin(beamAngle) * (radiusBase + beamLength);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = b % 2 === 0 ? '#ff0055' : '#00d4ff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 12;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.stroke();
      }

      // Central Waveform Rings
      const numPoints = 48;
      for (let ring = 1; ring <= 2; ring++) {
        ctx.beginPath();
        const ringRadius = radiusBase * (ring * 0.7);

        for (let i = 0; i < numPoints; i++) {
          const angle = (i / numPoints) * Math.PI * 2;
          const freqIndex = Math.floor((i / numPoints) * (bufferLength / 2));
          const amplitude = (dataArray[freqIndex] / 255) * (25 * ring * pulseScale);

          const r = ringRadius + amplitude;
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = ring === 1 ? '#ffe600' : '#ff007f';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 14;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.stroke();
      }

      ctx.restore();

      // --- 4. GIANT STAR-EYED EMOJI (🤩) IN CENTER OF CIRCLES ---
      const now = Date.now();
      if (bassRatio > 0.68 && (now - lastFlipTime > 650)) {
        const direction = Math.random() > 0.5 ? 1 : -1;
        const momentum = 0.06 + Math.random() * 0.08;
        emojiTargetSpinSpeed = direction * momentum;
        lastFlipTime = now;
      }

      emojiSpinSpeed += (emojiTargetSpinSpeed - emojiSpinSpeed) * 0.08;
      emojiTargetSpinSpeed *= 0.985;
      if (Math.abs(emojiTargetSpinSpeed) < 0.02) {
        emojiTargetSpinSpeed = (emojiTargetSpinSpeed >= 0 ? 1 : -1) * 0.022;
      }

      emojiAngle += emojiSpinSpeed;

      const baseFontSize = Math.min(width, height) * 0.18;
      const emojiScale = 1.0 + (bassRatio * 0.55);

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(emojiAngle);
      ctx.scale(emojiScale, emojiScale);

      ctx.shadowColor = bassRatio > 0.55 ? '#ffe600' : '#ff007f';
      ctx.shadowBlur = 16 + (bassRatio * 35);

      ctx.font = `${baseFontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🤩', 0, 0);

      ctx.restore();

      // Top HUD update
      const badge = document.getElementById('bpm-badge');
      if (badge && bassAvg > 140) {
        badge.innerText = `BASS: ${Math.round(bassAvg)}`;
        badge.style.color = '#ff007f';
        badge.style.borderColor = '#ff007f';
      } else if (badge) {
        badge.innerText = `AUDIO SYNC`;
        badge.style.color = '#00f0ff';
        badge.style.borderColor = '#00f0ff';
      }
    }

    function renderSyntheticVisualizer() {
      if (!isRunning) return;
      requestAnimationFrame(renderSyntheticVisualizer);

      const width = window.innerWidth;
      const height = window.innerHeight;
      const centerX = width / 2;
      const centerY = height / 2;

      ctx.fillStyle = 'rgba(5, 0, 12, 0.2)';
      ctx.fillRect(0, 0, width, height);

      rotationAngle += 0.015;
      const t = Date.now() * 0.004;
      const synthBass = (Math.sin(t) + 1) / 2;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rotationAngle);

      ctx.beginPath();
      ctx.arc(0, 0, 70 + synthBass * 50, 0, Math.PI * 2);
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 4;
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#ff007f';
      ctx.stroke();

      ctx.restore();

      // Synthetic Emoji Fallback
      emojiAngle += 0.03;
      const baseFontSize = Math.min(width, height) * 0.18;
      const emojiScale = 1.0 + (synthBass * 0.4);

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(emojiAngle);
      ctx.scale(emojiScale, emojiScale);

      ctx.shadowColor = '#ffe600';
      ctx.shadowBlur = 18;
      ctx.font = `${baseFontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🤩', 0, 0);

      ctx.restore();
    }

    function returnToDashboard() {
      isRunning = false;
      if (streamReference) {
        streamReference.getTracks().forEach(track => track.stop());
      }
      if (audioContext && audioContext.state !== 'closed') {
        audioContext.close();
      }
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
