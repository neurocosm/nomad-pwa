<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>NOMAD // VISUALIZER ARCADE</title>

  <!-- PWA & Mobile Display Metadata -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #050508;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    /* Top Header Section */
    .arcade-header {
      text-align: center;
      margin-top: 4px;
    }

    .arcade-title {
      font-size: clamp(1.4rem, 5vw, 1.85rem);
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #00f0ff, #ff007f, #ffe600, #39ff14);
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 6s linear infinite;
    }

    @keyframes rainbowShift {
      to { background-position: 300% center; }
    }

    .arcade-subtitle {
      font-size: 0.8rem;
      font-weight: 700;
      color: #888899;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* 2x2 Arcade Launch Grid */
    .visualizer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 480px;
      flex: 1;
      margin: 14px 0;
      min-height: 0;
    }

    .vis-card {
      background: #101018;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 10px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .vis-card:active {
      transform: scale(0.94);
    }

    /* Theme 1: Disco */
    .card-disco {
      border: 2px solid #ff007f;
      box-shadow: 0 0 14px rgba(255, 0, 127, 0.35);
    }
    .card-disco:active {
      background: rgba(255, 0, 127, 0.15);
    }

    /* Theme 2: Festival */
    .card-festival {
      border: 2px solid #00f0ff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
    }
    .card-festival:active {
      background: rgba(0, 240, 255, 0.15);
    }

    /* Theme 3: Slam Dance */
    .card-slamdance {
      border: 2px solid #39ff14;
      box-shadow: 0 0 14px rgba(57, 255, 20, 0.35);
    }
    .card-slamdance:active {
      background: rgba(57, 255, 20, 0.15);
    }

    /* Theme 4: Seasons */
    .card-seasons {
      border: 2px solid #ffbb00;
      box-shadow: 0 0 14px rgba(255, 187, 0, 0.35);
    }
    .card-seasons:active {
      background: rgba(255, 187, 0, 0.15);
    }

    .card-icon {
      font-size: clamp(2.2rem, 7.5vw, 3.0rem);
      margin-bottom: 6px;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
    }

    .card-name {
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
    }

    .card-disco .card-name { color: #ff007f; }
    .card-festival .card-name { color: #00f0ff; }
    .card-slamdance .card-name { color: #39ff14; }
    .card-seasons .card-name { color: #ffbb00; }

    .card-desc {
      font-size: 0.72rem;
      color: #aaaaaa;
      font-weight: 600;
      margin-top: 3px;
      text-align: center;
    }

    /* Bottom HUD Button */
    .btn-back-nomad {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #4cd964;
      color: #4cd964;
      font-size: 1.05rem;
      font-weight: 900;
      padding: 12px 32px;
      border-radius: 30px;
      box-shadow: 0 0 15px rgba(76, 217, 100, 0.5), inset 0 0 10px rgba(76, 217, 100, 0.2);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-back-nomad:active {
      transform: scale(0.92);
      background: rgba(76, 217, 100, 0.25);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="arcade-header">
    <div class="arcade-title">VISUALIZER ARCADE</div>
    <div class="arcade-subtitle">Audio-Reactive Cockpit FX</div>
  </div>

  <!-- 2x2 Launch Grid -->
  <div class="visualizer-grid">
    <!-- 1. DISCO -->
    <a href="disco.html" class="vis-card card-disco" onclick="window.location.replace('disco.html'); return false;">
      <div class="card-icon">🤩</div>
      <div class="card-name">Panic: Disco</div>
      <div class="card-desc">Radial Beams &amp; Dual EQ</div>
    </a>

    <!-- 2. FESTIVAL OF JOY -->
    <a href="festival.html" class="vis-card card-festival" onclick="window.location.replace('festival.html'); return false;">
      <div class="card-icon">🍄</div>
      <div class="card-name">Festival of Joy</div>
      <div class="card-desc">360° Mandala &amp; Notes</div>
    </a>

    <!-- 3. THE SLAM DANCE -->
    <a href="slamdance.html" class="vis-card card-slamdance" onclick="window.location.replace('slamdance.html'); return false;">
      <div class="card-icon">🤘</div>
      <div class="card-name">The Slam Dance</div>
      <div class="card-desc">Punk Skull &amp; Instruments</div>
    </a>

    <!-- 4. SEASONS -->
    <a href="seasons.html" class="vis-card card-seasons" onclick="window.location.replace('seasons.html'); return false;">
      <div class="card-icon">☀️</div>
      <div class="card-name">Seasons</div>
      <div class="card-desc">Auto Calendar Horizons</div>
    </a>
  </div>

  <!-- Bottom Return Button -->
  <a href="index.html" class="btn-back-nomad" onclick="window.location.replace('index.html'); return false;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4cd964" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    BACK TO NOMAD
  </a>

  <script>
    // Screen WakeLock
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && document.visibilityState === 'visible') {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    window.addEventListener('load', requestWakeLock);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    window.addEventListener('focus', requestWakeLock);
    window.addEventListener('touchstart', requestWakeLock, { passive: true });
    setInterval(requestWakeLock, 15000);
  </script>
</body>
</html>
