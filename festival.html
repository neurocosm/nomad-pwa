<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <title>NOMAD // FESTIVAL OF JOY</title>

  <!-- PWA & Mobile Display Metadata -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #kaleidoscope-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .top-hud-bar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 10;
      pointer-events: none;
    }

    .nav-btn-hub {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: #00f0ff;
      border: 1.5px solid #00f0ff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      transition: transform 0.15s ease, background 0.15s ease;
      cursor: pointer;
    }

    .nav-btn-hub:active {
      transform: scale(0.92);
      background: rgba(0, 240, 255, 0.25);
    }

    .hud-title-badge {
      background: rgba(0, 0, 0, 0.75);
      border: 1.5px solid #ff007f;
      color: #ff007f;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
    }

    .stage-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .mushroom-wrap {
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.9));
      transform-origin: center center;
      transition: transform 0.06s cubic-bezier(0.15, 0.9, 0.3, 1);
    }

    .mushroom-svg {
      width: clamp(210px, 56vw, 290px);
      height: auto;
    }

    .bottom-hud-container {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 10;
      pointer-events: auto;
    }

    .btn-back-nomad {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #4cd964;
      color: #4cd964;
      font-size: 1.05rem;
      font-weight: 900;
      padding: 12px 28px;
      border-radius: 30px;
      box-shadow: 0 0 15px rgba(76, 217, 100, 0.5), inset 0 0 10px rgba(76, 217, 100, 0.2);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-back-nomad:active {
      transform: scale(0.92);
      background: rgba(76, 217, 100, 0.25);
    }
  </style>
</head>
<body>

  <canvas id="kaleidoscope-canvas"></canvas>

  <div class="top-hud-bar">
    <a href="visualizer.html" class="nav-btn-hub" onclick="window.location.replace('visualizer.html'); return false;">&lt; VISUALIZERS</a>
    <div class="hud-title-badge" id="telemetry-badge">JOY // 0 MPH</div>
  </div>

  <div class="stage-container">
    <div class="mushroom-wrap" id="mushroom-hero">
      <svg class="mushroom-svg" viewBox="0 0 240 220">
        <defs>
          <linearGradient id="sunglassesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2a2a2a"/>
            <stop offset="45%" stop-color="#111111"/>
            <stop offset="50%" stop-color="#000000"/>
            <stop offset="100%" stop-color="#050505"/>
          </linearGradient>

          <radialGradient id="capGrad" cx="50%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ff3b47"/>
            <stop offset="70%" stop-color="#e60012"/>
            <stop offset="100%" stop-color="#99000a"/>
          </radialGradient>
        </defs>

        <path d="M 82,120 C 78,160 84,200 120,200 C 156,200 162,160 158,120 Z" fill="#f7ecd5" stroke="#4a3525" stroke-width="5" stroke-linejoin="round" />
        <path d="M 104,168 Q 120,184 136,168" fill="none" stroke="#4a3525" stroke-width="4.5" stroke-linecap="round" />
        <rect x="114" y="141" width="12" height="4" fill="#000000" rx="2" />
        <polygon id="sunglass-left" points="90,136 114,136 110,154 94,154" fill="url(#sunglassesGrad)" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
        <polygon id="sunglass-right" points="126,136 150,136 146,154 130,154" fill="url(#sunglassesGrad)" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
        <polygon points="93,138 99,138 96,150 92,150" fill="rgba(255, 255, 255, 0.75)" />
        <polygon points="129,138 135,138 132,150 128,150" fill="rgba(255, 255, 255, 0.75)" />

        <path d="M 22,125 C 20,45 220,45 218,125 C 200,135 40,135 22,125 Z" fill="url(#capGrad)" stroke="#300004" stroke-width="5.5" stroke-linejoin="round" />
        <ellipse cx="120" cy="72" rx="16" ry="15" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" />
        <ellipse cx="64" cy="94" rx="14" ry="13" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" />
        <ellipse cx="176" cy="94" rx="14" ry="13" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" />
        <ellipse cx="82" cy="58" rx="10" ry="9" fill="#ffffff" />
        <ellipse cx="158" cy="58" rx="10" ry="9" fill="#ffffff" />
        <circle cx="38" cy="116" r="6" fill="#ffffff" />
        <circle cx="202" cy="116" r="6" fill="#ffffff" />
      </svg>
    </div>
  </div>

  <div class="bottom-hud-container">
    <button class="btn-back-nomad" onclick="returnToDashboard()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4cd964" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      BACK TO NOMAD
    </button>
  </div>

  <script>
    const canvas = document.getElementById('kaleidoscope-canvas');
    const ctx = canvas.getContext('2d');
    const mushroomHero = document.getElementById('mushroom-hero');
    const badgeEl = document.getElementById('telemetry-badge');

    let width, height, centerX, centerY;
    let baseHue = 0;
    let symmetry = 8;
    let time = 0;

    let currentSpeedMPH = 0;
    let currentHeading = 0;
    let gyroTilt = 0;
    let watchId = null;
    let isRunning = true;
    let wakeLock = null;

    const noteGlyphs = ['♪', '♫', '♬', '♩', '♭', '♯'];
    let notes = [];

    const cosmicEmojis = ['🍄', '✨', '🌈', '🛸', '☮️', '🌻', '🪐', '💫', '💖'];
    let orbiters = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
      initOrbiters();
    }

    function initOrbiters() {
      orbiters = [];
      const count = 16;
      for (let i = 0; i < count; i++) {
        const isUpper = i < count / 2;
        orbiters.push({
          glyph: cosmicEmojis[i % cosmicEmojis.length],
          x: Math.random() * width,
          baseY: isUpper ? (height * 0.14 + Math.random() * (height * 0.16)) : (height * 0.74 + Math.random() * (height * 0.14)),
          speedX: (Math.random() * 0.8 + 0.4) * (i % 2 === 0 ? 1 : -1),
          bobOffset: Math.random() * Math.PI * 2,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.03,
          size: 14 + Math.random() * 8,
          glimmerHue: Math.random() * 360
        });
      }
    }

    window.addEventListener('resize', resize);
    resize();

    function initGPS() {
      if ('geolocation' in navigator) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            if (pos.coords.speed !== null && !isNaN(pos.coords.speed)) {
              currentSpeedMPH = Math.max(0, Math.round(pos.coords.speed * 2.23694));
            }
            if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
              currentHeading = pos.coords.heading;
            }
            badgeEl.innerText = `JOY // ${currentSpeedMPH} MPH`;
          },
          (err) => {},
          { enableHighAccuracy: true, maximumAge: 1000 }
        );
      }
    }

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (e) => {
        if (e.gamma !== null) {
          gyroTilt = Math.max(-25, Math.min(25, e.gamma));
        }
      });
    }

    function spawnNote(speedMult = 1.0, count = 1) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (1.5 + Math.random() * 3.5) * speedMult;
        const isNote = Math.random() < 0.8;
        const glyph = isNote 
          ? noteGlyphs[Math.floor(Math.random() * noteGlyphs.length)]
          : (Math.random() < 0.5 ? '✨' : '🍄');

        notes.push({
          x: centerX + Math.cos(angle) * 35,
          y: centerY + Math.sin(angle) * 35,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          glyph: glyph,
          size: isNote ? (18 + Math.random() * 18) : 14,
          hue: (baseHue + Math.random() * 140) % 360,
          alpha: 1.0,
          rotation: (Math.random() - 0.5) * 0.6,
          rotSpeed: (Math.random() - 0.5) * 0.06
        });
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && document.visibilityState === 'visible' && (wakeLock === null || wakeLock.released)) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    window.addEventListener('load', () => {
      initGPS();
      requestWakeLock();
      render();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    window.addEventListener('focus', requestWakeLock);
    window.addEventListener('touchstart', requestWakeLock, { passive: true });
    setInterval(requestWakeLock, 15000);

    function render() {
      if (!isRunning) return;

      const speedScale = Math.min(2.0, Math.max(0.6, currentSpeedMPH / 45));
      time += 0.035 * speedScale;

      const bassEnergy = 0.22 + Math.sin(time * 2.2) * 0.18;
      const midEnergy = 0.18 + Math.cos(time * 3.1) * 0.14;

      if (Math.random() < 0.12 * speedScale) spawnNote(1.0 * speedScale, 1);

      baseHue = (baseHue + 0.35 + (currentSpeedMPH / 60)) % 360;

      const mushroomScale = 1.0 + bassEnergy * 0.38;
      const mushroomTilt = Math.sin(time * 2.4) * 3 + (gyroTilt * 0.8) + (Math.sin(currentHeading * Math.PI / 180) * 4);
      mushroomHero.style.transform = `scale(${mushroomScale}) rotate(${mushroomTilt}deg)`;

      ctx.fillStyle = 'rgba(5, 0, 10, 0.22)';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(centerX, centerY);

      const angleStep = (Math.PI * 2) / symmetry;
      for (let s = 0; s < symmetry; s++) {
        ctx.save();
        ctx.rotate(s * angleStep + time * 0.09 + (currentHeading * Math.PI / 180) * 0.05);

        const numRings = 8;
        for (let r = 1; r <= numRings; r++) {
          const dist = r * (Math.min(width, height) * 0.065) + Math.sin(time * 2 + r) * 14;
          const hue = (baseHue + r * 30 + s * 15) % 360;
          const size = 10 + Math.cos(time * 3 + r) * 8 + r * 3 + bassEnergy * 14;

          ctx.strokeStyle = `hsla(${hue}, 95%, 60%, ${0.5 + bassEnergy * 0.45})`;
          ctx.fillStyle = `hsla(${(hue + 60) % 360}, 100%, 50%, 0.15)`;
          ctx.lineWidth = 2.0 + bassEnergy * 2.2;

          ctx.beginPath();
          ctx.moveTo(dist, 0);
          ctx.lineTo(dist + size, size * 0.75);
          ctx.lineTo(dist + size * 2, 0);
          ctx.lineTo(dist + size, -size * 0.75);
          ctx.closePath();
          ctx.stroke();
          ctx.fill();
        }
        ctx.restore();
      }
      ctx.restore();

      for (let i = 0; i < orbiters.length; i++) {
        const orb = orbiters[i];
        orb.x += orb.speedX * (1.0 + bassEnergy * 0.8);
        orb.rot += orb.rotSpeed;

        if (orb.x < -30) orb.x = width + 30;
        if (orb.x > width + 30) orb.x = -30;

        const currentY = orb.baseY + Math.sin(time * 2 + orb.bobOffset) * 16;
        ctx.save();
        ctx.translate(orb.x, currentY);
        ctx.rotate(orb.rot);
        ctx.font = `${orb.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(orb.glyph, 0, 0);
        ctx.restore();
      }

      for (let i = notes.length - 1; i >= 0; i--) {
        const n = notes[i];
        n.x += n.vx;
        n.y += n.vy;
        n.alpha *= 0.985;

        ctx.save();
        ctx.translate(n.x, n.y);
        ctx.font = `900 ${n.size}px sans-serif`;
        ctx.fillStyle = `hsla(${n.hue}, 100%, 65%, ${n.alpha})`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(n.glyph, 0, 0);
        ctx.restore();

        if (n.alpha < 0.02) notes.splice(i, 1);
      }

      requestAnimationFrame(render);
    }

    function returnToDashboard() {
      isRunning = false;
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      window.location.replace('index.html');
    }
  </script>
</body>
</html>
